name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, types, tests and committed-build parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and adapter tests
        run: npm test

      - name: Production build
        run: npm run build

      # web/ is committed on purpose (a reviewer can open the app without a toolchain).
      # That only works if the committed bytes are the bytes a fresh build produces, so this
      # step rebuilds and compares instead of merely checking that three files exist.
      - name: Verify the committed build matches a fresh build
        run: |
          set -uo pipefail
          test -f web/index.html || { echo "::error::web/index.html is missing"; exit 1; }
          test -f web/sw.js || { echo "::error::web/sw.js is missing"; exit 1; }

          status="$(git status --porcelain --untracked-files=all -- web/)"
          if [ -z "$status" ]; then
            echo "web/ is identical to a fresh 'npm run build'."
            node -e "const s=require('fs').readFileSync('web/sw.js','utf8');const m=s.match(/FILES=\[([^\]]*)\]/);console.log('Precache entries in web/sw.js:',JSON.parse('['+m[1]+']').length)"
            exit 0
          fi

          echo "::error title=Stale committed build::web/ differs from a fresh 'npm run build'."
          echo "The deployable build in web/ is out of date or was edited by hand."
          echo
          echo "Differences (git status --porcelain, all paths):"
          echo "$status"
          echo
          echo "What to do:"
          echo "  1. npm ci && npm run build"
          echo "  2. git add web/ && git commit -m 'chore: rebuild web/'"
          echo "  3. Do not edit web/ by hand; it is generated by 'vite build' + 'scripts/build-sw.mjs'."
          exit 1

      - name: Smoke the production server and the public-data API (offline snapshots)
        env:
          OFFLINE: "1"
        run: |
          set -euo pipefail
          npm start &
          server=$!
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/ > /dev/null
          curl -fsS http://127.0.0.1:3000/sw.js > /dev/null
          curl -fsS "http://127.0.0.1:3000/api/feeds?feed=studies" | head -c 200; echo
          curl -fsS "http://127.0.0.1:3000/api/feeds?feed=space-weather" | head -c 200; echo
          curl -fsS -o /dev/null http://127.0.0.1:3000/docs/PROHOR_Seven_Slide_Presentation.pdf
          curl -fsS -r 0-1023 -o /dev/null http://127.0.0.1:3000/media/prohor-30-second.mp4
          kill "$server"

  browser-smoke:
    name: Browser smoke (Playwright, offline snapshots)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install
        run: |
          npm ci
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium

      - name: Start the built app against dated snapshots
        env:
          OFFLINE: "1"
        run: |
          set -euo pipefail
          npm start > /tmp/prohor-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/ > /dev/null
          echo "server up"

      # Deterministic workflow checks only: no live network, no public feed dependency, no
      # screenshots that would dirty the tracked tree. All three read OFFLINE=1 snapshots.
      - name: Workflow checks
        env:
          OFFLINE: "1"
          PROHOR_URL: http://127.0.0.1:3000
        run: |
          set -euo pipefail
          python tests/e2e.py 2>&1 | tee /tmp/e2e.log
          python tests/browser_hardening.py 2>&1 | tee /tmp/hardening.log
          python tests/judges_resources.py 2>&1 | tee /tmp/judges.log
          python tests/presentation.py 2>&1 | tee /tmp/presentation.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-smoke-artifacts
          path: |
            docs/test-results/
            /tmp/e2e.log
            /tmp/hardening.log
            /tmp/judges.log
            /tmp/presentation.log
            /tmp/prohor-server.log
          if-no-files-found: warn
          retention-days: 14

      - name: Revert artefacts written into the working tree
        if: always()
        run: |
          git checkout -- . 2>/dev/null || true
          git clean -fd docs/test-results 2>/dev/null || true
          git status --porcelain

  accessibility:
    name: Accessibility sweep (manual, broader than smoke)
    # Deliberately not on every push: this is the slow axe-core sweep across 12 routes at two
    # widths plus the theme checks. Run it before a submission or after UI work.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install
        run: |
          npm ci
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium

      - name: Serve the built app
        env:
          OFFLINE: "1"
        run: |
          set -euo pipefail
          npm start > /tmp/prohor-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null 2>&1; then break; fi
            sleep 1
          done

      - name: axe-core sweep and overflow checks
        env:
          OFFLINE: "1"
          PROHOR_URL: http://127.0.0.1:3000
        run: |
          set -euo pipefail
          python tests/browser_sweep.py
          python tests/theme_checks.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-artifacts
          path: |
            docs/test-results/
            docs/screenshots/
            /tmp/prohor-server.log
          if-no-files-found: warn
          retention-days: 14

      - name: Revert artefacts written into the working tree
        if: always()
        run: |
          git checkout -- . 2>/dev/null || true
          git clean -fd docs/test-results 2>/dev/null || true
